<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>HOMA — هما</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:#0b0b0f;color:#f5f5f7}
body{overflow:hidden}.app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:auto}
header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #24242b;background:#101014}
.brand{display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#ec4899);font-weight:800}.title{font-size:17px;font-weight:700}.sub{font-size:11px;color:#8d8d98}
#status{font-size:11px;color:#8d8d98}.ok{color:#6ee7b7!important}.bad{color:#fca5a5!important}
main{flex:1;overflow:auto;padding:18px 14px 110px}.welcome{text-align:center;padding:14vh 18px 20px}.welcome h1{font-size:30px;margin:12px 0 8px}.welcome p{color:#a1a1aa;line-height:1.8;margin:0 auto;max-width:520px}
.msg{max-width:82%;padding:12px 14px;border-radius:18px;margin:10px 0;line-height:1.75;white-space:pre-wrap;word-break:break-word}.user{margin-right:auto;background:#6d28d9;border-bottom-right-radius:5px}.assistant{margin-left:auto;background:#19191f;border:1px solid #292932;border-bottom-left-radius:5px}
.composer{position:fixed;bottom:0;left:0;right:0;max-width:900px;margin:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b0b0f 22%)}.bar{display:flex;gap:8px;align-items:end;background:#17171d;border:1px solid #30303a;border-radius:22px;padding:7px 8px}.bar textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:#fff;font:inherit;min-height:42px;max-height:120px;padding:10px}.send{width:42px;height:42px;border:0;border-radius:50%;background:#8b5cf6;color:white;font-size:18px}.send:disabled{opacity:.45}
.overlay{position:fixed;inset:0;background:rgba(5,5,8,.92);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.card{width:min(430px,100%);background:#15151b;border:1px solid #30303a;border-radius:24px;padding:24px;box-shadow:0 20px 70px #000}.card h2{margin:0 0 8px}.card p{color:#a1a1aa;font-size:13px;line-height:1.8}.card input{width:100%;padding:14px;border-radius:14px;border:1px solid #35353f;background:#0d0d11;color:#fff;outline:0;font-size:16px}.card button{width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:#8b5cf6;color:white;font-weight:700;font-size:15px}.err{color:#fca5a5;font-size:12px;margin-top:9px;min-height:18px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">هـ</div><div><div class="title">هما</div><div class="sub">HOMA AI • 5.3</div></div></div><div id="status">در حال اتصال…</div></header>
<main id="chat"><div class="welcome" id="welcome"><div class="logo" style="margin:auto;width:58px;height:58px;font-size:22px">هـ</div><h1>سلام شهروز شاه 👋</h1><p>اینجا جای گفت‌وگوی تو با هماست. پیام اولت رو بنویس.</p></div></main>
<div class="composer"><div class="bar"><textarea id="input" rows="1" placeholder="پیامت رو بنویس…"></textarea><button class="send" id="send">➤</button></div></div>
</div>
<div class="overlay" id="login">
  <div class="card">
    <h2>ورود به هما</h2>
    <p>رمز دسترسی HOMA را وارد کن. رمز فقط برای همین اتصال استفاده می‌شود.</p>
    <input id="password" type="password" autocomplete="current-password" placeholder="Access password">
    <button id="loginBtn">ورود</button>
    <div class="err" id="err"></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const base=location.origin;
let password=sessionStorage.getItem("homa_password")||"";
let authenticated=false;

async function health(){
  try{
    const r=await fetch(base+"/api/health",{cache:"no-store"});
    const j=await r.json();
    $("#status").textContent=j.ok?"آنلاین":"خطا";
    $("#status").className=j.ok?"ok":"bad";
    if(j.secured && !password) $("#login").classList.remove("hidden");
    else if(!j.secured){authenticated=true;$("#login").classList.add("hidden")}
  }catch(e){$("#status").textContent="اتصال ناموفق";$("#status").className="bad"}
}
function add(text,who){
  $("#welcome").classList.add("hidden");
  const d=document.createElement("div"); d.className="msg "+who; d.textContent=text;
  $("#chat").appendChild(d); $("#chat").scrollTop=$("#chat").scrollHeight;
  return d;
}
function headers(){
  return {"Content-Type":"application/json","Authorization":"Bearer "+password,"X-HOMA-ACCESS-PASSWORD":password};
}
async function tryChat(text){
  const endpoints=["/api/chat","/api/message","/api/chat/send","/api/ask"];
  let last;
  for(const ep of endpoints){
    try{
      const r=await fetch(base+ep,{method:"POST",headers:headers(),body:JSON.stringify({message:text,text,prompt:text})});
      last=r;
      if(r.status===404||r.status===405) continue;
      const raw=await r.text();
      let data; try{data=JSON.parse(raw)}catch{data={response:raw}};
      if(r.ok) return data;
      if(r.status===401||r.status===403) throw new Error("رمز دسترسی اشتباه است.");
      if(r.status!==404) throw new Error(data.error||data.message||"خطا در پاسخ هما");
    }catch(e){if(e.message.includes("رمز"))throw e}
  }
  throw new Error("رابط گفت‌وگو در سرور پیدا نشد. APIهای فعلی HOMA باید به رابط متصل شوند.");
}
function pick(data){
  if(typeof data==="string")return data;
  return data.response||data.reply||data.message||data.answer||data.text||data.content||data.output||JSON.stringify(data);
}
async function send(){
  const el=$("#input"), text=el.value.trim(); if(!text)return;
  el.value=""; el.style.height="auto"; add(text,"user"); $("#send").disabled=true;
  const wait=add("در حال فکر کردن…","assistant");
  try{const data=await tryChat(text);wait.textContent=pick(data);authenticated=true;sessionStorage.setItem("homa_password",password)}
  catch(e){wait.textContent="⚠️ "+e.message}
  $("#send").disabled=false; el.focus();
}
$("#send").onclick=send;
$("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("#input").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px"});
$("#loginBtn").onclick=async()=>{
  password=$("#password").value;
  if(password.length<1){$("#err").textContent="رمز را وارد کن.";return}
  try{
    const r=await fetch(base+"/api/health",{headers:headers(),cache:"no-store"});
    if(r.ok){sessionStorage.setItem("homa_password",password);$("#login").classList.add("hidden");$("#err").textContent=""}
    else $("#err").textContent="رمز دسترسی پذیرفته نشد.";
  }catch(e){$("#err").textContent="اتصال به سرور برقرار نشد."}
};
$("#password").addEventListener("keydown",e=>{if(e.key==="Enter")$("#loginBtn").click()});
health();
</script>
</body>
</html>
