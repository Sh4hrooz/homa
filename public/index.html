<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f14"><title>HOMA AI</title><link rel="manifest" href="/manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0f14;color:#eee}header{height:62px;padding:10px 16px;border-bottom:1px solid #242b35;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0b0f14;z-index:2}h1{font-size:19px;margin:0}.status{font-size:11px;opacity:.75}main{max-width:900px;margin:auto;height:calc(100vh - 62px);display:flex;flex-direction:column}#chat{flex:1;overflow:auto;padding:14px}.m{padding:11px 14px;border-radius:16px;margin:9px 0;white-space:pre-wrap;line-height:1.8;max-width:90%;box-shadow:0 2px 10px #0002}.user{background:#17324a;margin-right:auto}.assistant{background:#202630;margin-left:auto}.meta{font-size:10px;opacity:.5;margin-top:4px}.actions{display:flex;gap:6px;padding:7px 10px;border-top:1px solid #242b35}.small{font-size:11px;padding:7px 10px;background:#222a35;color:#ddd;border:0;border-radius:10px}.typing{opacity:.6}form{display:flex;gap:7px;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}textarea{flex:1;resize:none;border:1px solid #333b49;background:#151a21;color:#fff;border-radius:13px;padding:11px;font:inherit;min-height:48px;max-height:150px}button{border:0;border-radius:11px;padding:0 15px;background:#eee;color:#111;font-weight:700}#login{position:fixed;inset:0;background:#0b0f14;display:none;place-items:center;padding:22px;z-index:10}.card{width:min(390px,100%);border:1px solid #29313d;border-radius:18px;padding:22px;background:#121820}.card h2{margin-top:0}.card input{width:100%;padding:12px;border-radius:11px;border:1px solid #394250;background:#0d1218;color:#fff;font:inherit;margin:10px 0}.card button{height:44px;width:100%}.err{font-size:12px;margin-top:10px}
</style></head><body><div id="login"><div class="card"><h2>ورود به هما</h2><div>فضای خصوصی مدیر پروژه</div><input id="password" type="password" autocomplete="current-password" placeholder="رمز ورود"><button id="loginBtn">ورود</button><div class="err" id="loginErr"></div></div></div><header><h1>HOMA AI</h1><span class="status" id="status">در حال آماده‌سازی…</span></header><main><div id="chat"></div><div class="actions"><button class="small" id="clear">پاک کردن گفتگو</button><button class="small" id="logout">خروج</button></div><form id="form"><textarea id="input" rows="1" placeholder="بگو، هما گوشه…"></textarea><button id="send">ارسال</button></form></main><script src="/app.js" defer></script></body></html>
